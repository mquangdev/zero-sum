name: CI

on:
  pull_request:
  push:
    branches: [main]

# Keep only the latest run per branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Generates the route types in .next/types first, then runs tsc.
      - name: Typecheck
        run: npm run typecheck

      # Money and settlement logic live in pure functions covered by unit tests.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
